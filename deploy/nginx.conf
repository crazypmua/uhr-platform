# Repository and all site files live in /home/uhr/app.
# Python selects waiting/full frontend using the database and admin cookies.
# Nginx is the public HTTPS entry point and proxies both domains to Python.

upstream uhr_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name ukrwerkspot.nl;
    return 301 https://ukrwerkspot.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ukrwerkspot.nl;

    ssl_certificate     /etc/letsencrypt/live/ukrwerkspot.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukrwerkspot.nl/privkey.pem;

    client_max_body_size 30m;

    # The common admin panel exists only on uhrbv.nl.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://uhr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name uhrbv.nl;
    return 301 https://uhrbv.nl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uhrbv.nl;

    ssl_certificate     /etc/letsencrypt/live/uhrbv.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uhrbv.nl/privkey.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://uhr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
